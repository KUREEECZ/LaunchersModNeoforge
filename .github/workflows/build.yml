name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Read artifact name and version
        id: artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          properties = {}
          for line in Path("gradle.properties").read_text().splitlines():
              if line.strip() and not line.lstrip().startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()

          name = f"{properties['archives_base_name']}-{properties['mod_version']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={name}\n")
              output.write(f"path=build/libs/{name}.jar\n")
          PY

      - name: Build and test
        run: bash gradlew --no-daemon --console=plain build

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 90
